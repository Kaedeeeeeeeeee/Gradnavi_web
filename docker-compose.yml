# 本地开发只起数据库：docker compose up -d，然后 npm run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gradnavi
      POSTGRES_PASSWORD: gradnavi
      POSTGRES_DB: gradnavi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
