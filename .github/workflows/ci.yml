name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: 检查数据库迁移是否与 schema 同步
        run: |
          npx drizzle-kit generate --name ci-check
          test -z "$(git status --porcelain drizzle)" || (echo "schema 有改动但没有生成迁移，请运行 npm run db:generate" && exit 1)
        env:
          DATABASE_URL: postgres://unused@localhost/unused
      - run: npm run build
      - run: npm run build:worker

  # main 分支：构建镜像并推送到 GitHub 容器仓库（ghcr.io）
  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/kaedeeeeeeeeee/gradnavi_web:latest
            ghcr.io/kaedeeeeeeeeee/gradnavi_web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
