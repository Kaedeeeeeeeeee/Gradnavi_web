# 生产部署：一台服务器跑 Caddy（自动 HTTPS）+ web + worker（定时任务）+ Postgres。
# 用法见根目录 README「部署」一节。
services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/kaedeeeeeeeeee/gradnavi_web:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://gradnavi:${POSTGRES_PASSWORD}@db:5432/gradnavi
    depends_on:
      db:
        condition: service_healthy

  # 定时任务（募集要项每日检查）。同一个镜像，web 跑完数据库迁移、健康后再启动
  worker:
    image: ${WEB_IMAGE:-ghcr.io/kaedeeeeeeeeee/gradnavi_web:latest}
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "worker.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://gradnavi:${POSTGRES_PASSWORD}@db:5432/gradnavi
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradnavi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: gradnavi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradnavi"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中设置 DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
